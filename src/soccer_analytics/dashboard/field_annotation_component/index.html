<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: transparent;
        color: #e5e7eb;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 0 0 8px 0;
      }
      button {
        background: #1f2937;
        color: white;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 13px;
      }
      #zoom-out,
      #zoom-in {
        min-width: 32px;
        font-weight: 700;
      }
      #zoom-readout {
        font-size: 12px;
        color: #9ca3af;
        min-width: 62px;
        text-align: center;
      }
      /* The landmark picker is a popover at the click itself: click, and the list of landmarks appears where you
         clicked, so the choice is made about the thing being pointed at rather than in a toolbar far away. */
      #marker-popover {
        position: absolute;
        z-index: 5;
        background: #0b1220;
        border: 1px solid #374151;
        border-radius: 6px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
        max-height: 260px;
        min-width: 210px;
        overflow-y: auto;
        padding: 4px;
      }
      #marker-popover button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 4px;
        color: #e5e7eb;
        padding: 5px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      #marker-popover button:hover {
        background: #2563eb;
      }

      /* Two viewports side by side: the magnified crop you click on, and the whole frame that you aim it with.
         They share the available width, so both scale down rather than needing controls between them. */
      #layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        align-items: start;
      }
      #crop-wrap {
        grid-column: 1;
        position: relative;
        border: 1px solid #374151;
        background: #0f172a;
        line-height: 0;
      }
      #overview-wrap {
        grid-column: 2;
        border: 1px solid #374151;
        background: #0f172a;
        line-height: 0;
        cursor: crosshair;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      #overviewVideo {
        display: block;
        width: 100%;
        height: auto;
      }
      /* The whole-frame viewport is also the timeline. With a proxy the video carries the picture and the overlay
         canvas rides on top of it, so the crop box and the landmark markers are drawn over the moving frames.
         Without one (the proxy is still building) the canvas keeps drawing a still frame and sizes the box, exactly
         as it did before, and the scrub row stays hidden. */
      #layout.video-mode #overview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #layout.image-mode #overviewVideo,
      #layout.image-mode #scrub-row {
        display: none;
      }
      #scrub-row {
        grid-column: 1 / -1;
        grid-row: 3;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #play {
        min-width: 58px;
      }
      #scrub {
        flex: 1;
        accent-color: #22d3ee;
        margin: 0;
      }
      #scrub-caption {
        font-size: 12px;
        color: #9ca3af;
        white-space: nowrap;
      }
      #timeline-readout {
        font-size: 12px;
        color: #9ca3af;
        min-width: 150px;
        text-align: right;
        white-space: nowrap;
      }
      .viewport-label {
        padding-top: 4px;
        font-size: 11px;
        line-height: 1.4;
        color: #9ca3af;
      }
      #layout .viewport-label {
        grid-row: 2;
      }
      #crop-label {
        grid-column: 1;
      }
      #overview-label {
        grid-column: 2;
      }
      /* Scrubbing does not re-render the crop, so say when the two views are on different frames. */
      #crop-note {
        color: #facc15;
      }

      #hint {
        padding-top: 6px;
        font-size: 12px;
        color: #9ca3af;
        min-height: 16px;
      }
      #hint b {
        color: #22d3ee;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="clear-btn" title="Remove the applied points in the frame you are looking at">Clear</button>
      <button id="zoom-out" title="Zoom out">-</button>
      <span id="zoom-readout">zoom 8x</span>
      <button id="zoom-in" title="Zoom in">+</button>
    </div>

    <div id="layout">
      <div id="crop-wrap">
        <canvas id="fieldCanvas"></canvas>
        <div id="marker-popover" hidden></div>
      </div>
      <div id="overview-wrap">
        <video id="overviewVideo" muted playsinline preload="auto"></video>
        <canvas id="overview"></canvas>
      </div>
      <div id="crop-label" class="viewport-label">
        <b>Magnified.</b> Click to place a landmark - pick which one in the list that appears where you clicked.
        <span id="crop-note"></span>
      </div>
      <div id="overview-label" class="viewport-label">
        <b>Whole frame.</b> Click a point to aim the magnified view there; scroll to zoom in on it; scrub the timeline
        below to a frame where the markings are clear.
      </div>
      <div id="scrub-row">
        <button id="play" title="Play or pause the whole-frame view">Play</button>
        <span id="scrub-caption">Timeline</span>
        <input id="scrub" type="range" min="0" max="0" step="1" value="0" title="Scrub the whole-frame view" />
        <span id="timeline-readout"></span>
      </div>
    </div>
    <div id="hint"></div>

    <script>
      const Streamlit = {
        RENDER_EVENT: 'streamlit:render',
        events: new EventTarget(),
        setComponentValue(value) {
          window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setComponentValue', value}, '*');
        },
        setFrameHeight(height) {
          window.parent.postMessage(
            {isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: height || document.body.scrollHeight},
            '*'
          );
        },
      };

      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'streamlit:render') {
          Streamlit.events.dispatchEvent(new CustomEvent(Streamlit.RENDER_EVENT, {detail: event.data}));
        }
      });

      window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1}, '*');

      const ZOOM_MIN = 1;
      const ZOOM_MAX = 16;
      const WHEEL_STEP = 1.25;
      const CLICK_SLOP_PX = 4;

      const canvas = document.getElementById('fieldCanvas');
      const ctx = canvas.getContext('2d');
      const overview = document.getElementById('overview');
      const overviewCtx = overview.getContext('2d');
      const overviewVideo = document.getElementById('overviewVideo');
      const layout = document.getElementById('layout');
      const scrub = document.getElementById('scrub');
      const playBtn = document.getElementById('play');
      const timelineReadout = document.getElementById('timeline-readout');
      const cropNote = document.getElementById('crop-note');
      const zoomReadout = document.getElementById('zoom-readout');
      const hint = document.getElementById('hint');
      const clearBtn = document.getElementById('clear-btn');
      const popover = document.getElementById('marker-popover');

      let currentPoints = [];
      let savedPolygon = [];
      let savedFeatures = [];
      let markerOptions = ''; // the landmark list last written into the popover, so a rerun does not reset it
      let popoverOpen = false; // whether the landmark picker is showing at the last click
      let bgImage = null;
      let overviewImage = null;
      let overviewDataSrc = ''; // so an unchanged still is not re-decoded on every rerun
      let args = {};
      let lastActual = {x: 0.5, y: 0.5};
      // The view is described entirely by where it is centered (fractions of frame width and height) and how far in
      // it is zoomed. Everything the user does - clicking or scrolling the overview, pressing the zoom buttons, or
      // scrubbing the timeline - only changes these, and Python is told about it afterwards.
      let center = {x: 0.5, y: 0.5};
      let zoom = 8;
      let navigating = false;
      let panning = false;
      let panStart = null;
      let movedPx = 0;
      let wheelTimer = null;
      // Timeline state. The proxy is optional: without one (it is still being built) the viewport falls back to a
      // still frame and the scrub row is hidden.
      let videoMode = false;
      let videoReady = false;
      let frameCount = 1;
      let analysisFps = 0; // analysis frames per second; the proxy runs in real time from the segment's start
      let duration = 0;
      let mounted = false; // whether this iframe has applied its initial frame yet
      let pendingFrame = null; // the frame to land on once the video's metadata has loaded
      let cropFrame = 0; // the frame the magnified crop was actually rendered from
      let seekPending = false;
      // The pitch overlay, drawn by the browser: sampled pitch->pixel homographies plus the markings in pitch
      // meters. Python recomputes both whenever the calibration changes, so a refit redraws.
      let overlaySamples = []; // [{t: proxy seconds, h: [9]}] in time order
      let overlayMode = 'interpolate'; // 'latest' = one sample per proxy picture; 'interpolate' = dense grid
      let overlayPolylines = []; // [[x, y], ...] per marking, in pitch meters

      function clamp(value, low, high) {
        if (high < low) return (low + high) / 2;
        return Math.min(Math.max(value, low), high);
      }
      function clamp01(value) {
        return clamp(value, 0, 1);
      }

      function updateZoomReadout() {
        zoomReadout.textContent = `zoom ${zoom.toFixed(zoom < 10 ? 1 : 0)}x`;
      }

      /* While a gesture is in progress the hint only describes what has been asked for. Whether the request is
         actually reachable depends on the crop being held at a frame edge, which Python works out and reports back
         in `actual_*` - guessing it here would mean claiming "held" for perfectly reachable positions. */
      function updateHint() {
        const requested = `zoom <b>${zoom.toFixed(1)}x</b>, centered on <b>${(center.x * 100).toFixed(0)}%</b>, <b>${(
          center.y * 100
        ).toFixed(0)}%</b> of the frame`;
        if (navigating) {
          hint.innerHTML = requested;
          return;
        }
        const held = Math.abs(center.x - lastActual.x) > 0.002 || Math.abs(center.y - lastActual.y) > 0.002;
        hint.innerHTML = held
          ? `${requested} (held at ${(lastActual.x * 100).toFixed(0)}%, ${(lastActual.y * 100).toFixed(0)}% by the frame edge)`
          : requested;
      }

      function setCanvasSize(target, width, height) {
        target.width = width;
        target.height = height;
      }

      /* Where the crop would sit if the center were applied right now, in native frame pixels. Mirrors the clamping
         in `zoom_box` on the Python side so the box drawn here is the box that will actually be used. */
      function cropBox() {
        const frameWidth = args.frame_width || canvas.width;
        const frameHeight = args.frame_height || canvas.height;
        const cropW = frameWidth / zoom;
        const cropH = frameHeight / zoom;
        const centerX = clamp(center.x * frameWidth, cropW / 2, frameWidth - cropW / 2);
        const centerY = clamp(center.y * frameHeight, cropH / 2, frameHeight - cropH / 2);
        return {x: centerX - cropW / 2, y: centerY - cropH / 2, w: cropW, h: cropH};
      }

      /* Whether the picture on screen really is the frame the crop - and so the markers - belong to.
         In video mode the proxy is only a scrubbing aid: it is built from the camera's keyframes, so it holds one
         picture per second and at speed its picture sits half a second behind the readout. A marker drawn on it
         would point where the corner was half a second ago, which reads as a bug in the click. The still Python
         sends with every render is the exact crop frame, so it is shown instead whenever the viewport is at rest
         on that frame. */
      function pictureIsExact() {
        if (!videoMode) return true;
        if (!videoReady || !overviewImage || !overviewVideo.paused) return false;
        return clampFrame(Number(scrub.value)) === cropFrame;
      }

      /* Python sends the sampled homographies as nine little-endian float32s per sample, base64-encoded: one
         matrix per proxy picture is thousands of samples, which as JSON digits would be most of a megabyte on
         every gesture. `times` says when each sample's picture starts. */
      function decodeOverlay(payload) {
        if (!payload || !Array.isArray(payload.times) || typeof payload.matrices !== 'string') return [];
        if (!payload.matrices.length) return [];
        const binary = atob(payload.matrices);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        const floats = new Float32Array(bytes.buffer);
        const count = Math.min(payload.times.length, Math.floor(floats.length / 9));
        const samples = [];
        for (let i = 0; i < count; i += 1) {
          samples.push({t: Number(payload.times[i]), h: Array.from(floats.subarray(i * 9, i * 9 + 9))});
        }
        return samples;
      }

      function sampleAtOrBefore(time) {
        let lo = 0;
        let hi = overlaySamples.length - 1;
        if (time < overlaySamples[0].t) return 0;
        while (lo < hi) {
          const mid = Math.ceil((lo + hi) / 2);
          if (overlaySamples[mid].t <= time + 1e-6) lo = mid;
          else hi = mid - 1;
        }
        return lo;
      }

      /* The homography for the picture on screen. In "latest" mode the samples are one per proxy picture, and the
         picture displayed at a media time is the first sample at or before it - using it directly, with no
         blending, is what keeps the geometry on the picture while scrubbing (between two pictures a second apart
         a blended matrix is wrong by the whole pan between them). In "interpolate" mode the samples are a dense
         grid over a proxy that holds every frame, where blending is far below a pixel. */
      function overlayMatrix(time) {
        if (!overlaySamples.length) return null;
        const index = sampleAtOrBefore(time);
        const before = overlaySamples[index];
        if (overlayMode === 'latest') return before.h;
        const after = overlaySamples[Math.min(overlaySamples.length - 1, index + 1)];
        if (after === before || time <= before.t) return before.h;
        const t = (time - before.t) / Math.max(1e-9, after.t - before.t);
        return before.h.map((value, i) => value + (after.h[i] - value) * t);
      }

      /* The media time of the picture actually on screen. The scrub readout is not it: a keyframe-only proxy
         repeats one picture for a second or more while the bar moves in 30 fps steps, and a homography drawn for
         the bar position lands on a different picture than the one the eye sees - which read as an unstable fit
         during pans. While playing this is the presented frame's own time; while paused it is the video's clock. */
      function overlayTime() {
        if (videoMode && videoReady) {
          if (!overviewVideo.paused) {
            return presentedMediaTime !== null ? presentedMediaTime : overviewVideo.currentTime;
          }
          return overviewVideo.currentTime;
        }
        return frameToTime(cropFrame);
      }

      function drawPitchOverlay() {
        if (!overlaySamples.length || !overlayPolylines.length) return;
        const h = overlayMatrix(overlayTime());
        if (!h) return;
        const frameWidth = args.frame_width || overview.width;
        const frameHeight = args.frame_height || overview.height;
        const toX = overview.width / frameWidth;
        // v is normalized by the frame *width* (the solver's convention), and the canvas maps frame pixels onto
        // itself by (canvas/frame) ratios: x by width, y by height. Dividing by the width here squashed the
        // geometry to 9/16 of its height - the pitch was drawn hovering far above the field.
        const toY = overview.height / frameHeight;
        overviewCtx.save();
        // The same yellow and weight Python bakes into the exact still (cv2 BGR (0, 255, 255) = this yellow), so
        // swapping between the still and the moving projection does not read as a change of geometry.
        overviewCtx.strokeStyle = 'rgba(255, 255, 0, 0.9)';
        overviewCtx.lineWidth = 3;
        for (const line of overlayPolylines) {
          overviewCtx.beginPath();
          let started = false;
          for (const [x, y] of line) {
            const w = h[6] * x + h[7] * y + h[8];
            if (!(w > 1e-9)) {
              // The point is on the camera plane: the segment to it is not a projection, so break the line.
              started = false;
              continue;
            }
            const u = (h[0] * x + h[1] * y + h[2]) / w;
            const v = (h[3] * x + h[4] * y + h[5]) / w;
            const px = u * frameWidth * toX;
            const py = v * frameWidth * toY;
            if (!started) {
              overviewCtx.moveTo(px, py);
              started = true;
            } else {
              overviewCtx.lineTo(px, py);
            }
          }
          overviewCtx.stroke();
        }
        overviewCtx.restore();
      }

      function drawOverview() {
        if (!videoMode && !overviewImage) return;
        const frameWidth = args.frame_width || overview.width;
        const frameHeight = args.frame_height || overview.height;
        const toX = overview.width / frameWidth;
        const toY = overview.height / frameHeight;
        const exact = pictureIsExact();

        overviewCtx.clearRect(0, 0, overview.width, overview.height);
        const stillUp = exact && overviewImage;
        if (stillUp) {
          // Covers the video underneath, so what is compared with the crop is the crop's own frame. Python bakes
          // the calibration into this still (the bolder markings and the landmark crosses), so the browser must
          // not project a second copy over it: two projections for one moment - one interpolated and one exact,
          // disagreeing slightly - is exactly what the user reads as "the overlay is drawn wrong".
          overviewCtx.drawImage(overviewImage, 0, 0, overview.width, overview.height);
        } else {
          // Away from the crop's frame the picture is the coarse proxy and Python cannot have drawn on it, so the
          // browser projects the pitch for whatever frame the timeline is showing - scrubbed or playing - from
          // the sampled homographies. It is drawn *under* the click markers and the crop box: those are what is
          // being aimed at, and the moving projection must not draw over them.
          drawPitchOverlay();
        }

        // Landmarks already clicked on this frame, so the whole frame shows the work in progress - but only while
        // the picture is the frame they were clicked on, or they would be markers for a picture nobody can see.
        if (exact) {
          overviewCtx.save();
          (args.marker_points || []).forEach(([u, v]) => {
            overviewCtx.beginPath();
            overviewCtx.arc(u * frameWidth * toX, v * frameWidth * toY, 6, 0, Math.PI * 2);
            overviewCtx.fillStyle = '#facc15';
            overviewCtx.fill();
            overviewCtx.strokeStyle = '#78350f';
            overviewCtx.lineWidth = 2;
            overviewCtx.stroke();
          });
          overviewCtx.restore();
        }

        const box = cropBox();
        overviewCtx.strokeStyle = '#facc15';
        overviewCtx.lineWidth = 2;
        overviewCtx.strokeRect(box.x * toX, box.y * toY, box.w * toX, box.h * toY);
      }

      /* While the proxy plays, the geometry is redrawn once per frame the video actually presents.
         `requestVideoFrameCallback` reports the media time of each presented frame - drawing on that moment is
         what makes the geometry sit exactly on the picture instead of trailing it, where `timeupdate` (a few
         times a second) and even a read of `currentTime` per animation frame can be a quarter second off.
         Browsers without the callback fall back to the rAF loop reading the video clock. Both stop themselves as
         soon as the video is not playing; `play` starts them again. */
      let playbackRaf = 0;
      let presentedMediaTime = null; // media time of the frame on screen, while playing

      function schedulePlaybackFrame() {
        if (!videoMode || overviewVideo.paused) return;
        if (typeof overviewVideo.requestVideoFrameCallback === 'function') {
          overviewVideo.requestVideoFrameCallback(onPresentedFrame);
        } else if (!playbackRaf) {
          playbackRaf = requestAnimationFrame(playbackTick);
        }
      }

      function onPresentedFrame(_now, metadata) {
        presentedMediaTime = metadata.mediaTime;
        if (!videoMode || overviewVideo.paused) return;
        scrub.value = String(timeToFrame(presentedMediaTime));
        updateTimelineReadout();
        drawOverview();
        schedulePlaybackFrame();
      }

      function playbackTick() {
        playbackRaf = 0;
        if (!videoMode || overviewVideo.paused) return;
        presentedMediaTime = null; // no presentation clock available; the video clock drives the overlay
        scrub.value = String(timeToFrame(overviewVideo.currentTime));
        updateTimelineReadout();
        drawOverview();
        playbackRaf = requestAnimationFrame(playbackTick);
      }

      function startPlaybackTick() {
        if (videoMode && !overviewVideo.paused) schedulePlaybackFrame();
      }

      function drawImage() {
        if (!bgImage) {
          drawSavedAnnotations();
          return;
        }
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          drawSavedAnnotations();
        };
        img.src = bgImage;
      }

      function drawSavedAnnotations() {
        if (savedPolygon.length > 1) {
          ctx.beginPath();
          savedPolygon.forEach(([x, y], index) => {
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.closePath();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        savedFeatures.forEach((feature) => {
          if (feature.type === 'line' && feature.points.length >= 2) {
            ctx.beginPath();
            feature.points.forEach(([x, y], index) => {
              if (index === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
          if (feature.type === 'point') {
            const [x, y] = feature.point;
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#facc15';
            ctx.fill();
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 1;
            ctx.stroke();
            if (feature.label) {
              // Which marker is which. With five markers on screen the name is what makes the drag a decision
              // rather than a guess, and outlined text stays readable over grass and over the pitch markings.
              ctx.font = '600 12px system-ui, sans-serif';
              ctx.textBaseline = 'bottom';
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 3;
              ctx.strokeText(feature.label, x + 10, y - 8);
              ctx.fillStyle = '#ffffff';
              ctx.fillText(feature.label, x + 10, y - 8);
            }
          }
        });

        if (currentPoints.length > 1) {
          ctx.beginPath();
          currentPoints.forEach(([x, y], index) => {
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        if (currentPoints.length > 0) {
          currentPoints.forEach(([x, y]) => {
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbf24';
            ctx.fill();
          });
        }
      }

      function redraw() {
        drawOverview();
        drawImage();
      }

      /* The landmark picker: a popover at the click itself. The click is committed immediately with the landmark
         chosen in the popover, so there is no Apply step and no toolbar picker to pre-select from - the choice is
         made about the thing being pointed at, and the list is long enough that naming it there beats naming it in
         advance. */
      function openPopover(x, y) {
        const names = args.marker_kinds || [];
        if (!names.length) return;
        popover.innerHTML = '';
        for (const name of names) {
          const option = document.createElement('button');
          option.type = 'button';
          option.textContent = name;
          option.addEventListener('click', () => {
            closePopover();
            commitPoint(x, y, name);
          });
          popover.appendChild(option);
        }
        popover.hidden = false;
        popoverOpen = true;
        // Keep the popover inside the crop: a click near an edge must not cut the list off.
        const wrap = popover.parentElement;
        const left = clamp(x - popover.offsetWidth / 2, 4, Math.max(4, wrap.clientWidth - popover.offsetWidth - 4));
        const top = clamp(y + 10, 4, Math.max(4, wrap.clientHeight - popover.offsetHeight - 4));
        popover.style.left = `${left}px`;
        popover.style.top = `${top}px`;
      }

      function closePopover() {
        popover.hidden = true;
        popoverOpen = false;
      }

      document.addEventListener('click', (event) => {
        if (popoverOpen && !popover.contains(event.target)) closePopover();
      });

      function commitPoint(x, y, label) {
        // The click is its own commit: the position and its landmark go to Python at once, and the marker on
        // screen becomes Python's canonical copy of the click (dirty=false) rather than a pending gesture.
        savedFeatures.push({type: 'point', point: [x, y], label, dirty: false});
        currentPoints = [];
        redraw();
        sendValue('apply');
      }

      function addPoint(x, y) {
        // Point mode is the only mode: a click opens the landmark picker at the click itself.
        openPopover(x, y);
      }

      canvas.addEventListener('click', (event) => {
        // Not let through to the document-level closer, which would shut the popover this click is about to open.
        event.stopPropagation();
        if (suppressClick) {
          // The pointer was dragging a marker, not placing one: the drag has already said what it had to say.
          suppressClick = false;
          return;
        }
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (canvas.width / rect.width);
        const y = (event.clientY - rect.top) * (canvas.height / rect.height);
        addPoint(Math.round(x), Math.round(y));
      });

      /* Dragging a placed marker is how a projected landmark is corrected: the marker carries its label, so moving
         it onto the real marking is the whole measurement Python needs - and it is quicker than clicking from
         scratch. A drag that actually moved suppresses the click that follows, so a drag never opens the picker
         behind it. */
      const DRAG_RADIUS = 14;
      let dragging = null;
      let suppressClick = false;

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return [
          Math.round((event.clientX - rect.left) * (canvas.width / rect.width)),
          Math.round((event.clientY - rect.top) * (canvas.height / rect.height)),
        ];
      }

      function featureNear(x, y) {
        let found = null;
        let best = DRAG_RADIUS;
        savedFeatures.forEach((feature, index) => {
          if (feature.type !== 'point') return;
          const distance = Math.hypot(feature.point[0] - x, feature.point[1] - y);
          if (distance <= best) {
            found = index;
            best = distance;
          }
        });
        return found;
      }

      canvas.addEventListener('mousedown', (event) => {
        const [x, y] = canvasPoint(event);
        const index = featureNear(x, y);
        if (index === null) return;
        dragging = { index, dx: savedFeatures[index].point[0] - x, dy: savedFeatures[index].point[1] - y, moved: false };
        event.preventDefault();
      });

      canvas.addEventListener('mousemove', (event) => {
        if (!dragging) return;
        const [x, y] = canvasPoint(event);
        const feature = savedFeatures[dragging.index];
        const nextX = clamp(x + dragging.dx, 0, canvas.width);
        const nextY = clamp(y + dragging.dy, 0, canvas.height);
        if (Math.hypot(nextX - feature.point[0], nextY - feature.point[1]) > 1) dragging.moved = true;
        feature.point = [nextX, nextY];
        // Dirty means "moved since Python last heard about it": a rerun caused by anything else (aiming the view,
        // zooming) must not yank the marker back to the position it was placed at.
        feature.dirty = true;
        redraw();
      });

      function endDrag() {
        if (dragging && dragging.moved) {
          suppressClick = true;
          // The drag is the measurement, so like a click it commits the moment it ends: the moved marker goes to
          // Python at once, and its position becomes the canonical copy rather than a pending gesture.
          savedFeatures.forEach((feature) => {
            if (feature) feature.dirty = false;
          });
          redraw();
          sendValue('apply');
        }
        dragging = null;
      }
      canvas.addEventListener('mouseup', endDrag);
      canvas.addEventListener('mouseleave', endDrag);

      /* Clear removes the applied points in the frame of reference - the frame the crop is on - and leaves the
         clicks of every other frame alone. That is the same scoping a commit has: the crop is one frame's worth of
         work, so undoing it must not undo the rest. */
      clearBtn.addEventListener('click', () => {
        savedPolygon = [];
        savedFeatures = [];
        currentPoints = [];
        closePopover();
        redraw();
        sendValue('clear');
      });

      /* The current frame rides along with every aiming gesture while the timeline is live. Scrubbing is deliberately
         local and reports nothing, so the magnified crop re-renders only when the user actually aims at a point; the
         gesture therefore has to carry the frame, or aiming after a scrub would crop a frame that is not on screen.
         Python ignores the frame on a commit, because the points on screen belong to the crop that is already
         loaded - which is also the frame Clear is scoped to. */
      function currentFrame() {
        return videoMode ? clampFrame(Number(scrub.value)) : null;
      }

      /* Every reported gesture carries a sequence number, so Python can tell a fresh gesture from the sticky value
         of an old one coming back on a later rerun - without remounting the component (and reloading the proxy
         video) after every click. `mount` is the remount counter Python bumps when it re-keys the component, so the
         sequence restarting from 1 on a fresh mount can never be mistaken for an already-seen gesture. */
      let seq = 0;
      function sendValue(action) {
        seq += 1;
        Streamlit.setComponentValue({
          polygon: savedPolygon,
          features: savedFeatures,
          center_x: center.x,
          center_y: center.y,
          zoom: zoom,
          action: action,
          frame: currentFrame(),
          seq: seq,
          mount: typeof args.mount_nonce === 'number' ? args.mount_nonce : 0,
        });
      }

      /* ---------------------------------------------------------------------------------------------------
         The overview is the control surface: click to aim at a point, scroll to zoom in on it, drag to pan.
         All of it updates locally and only tells Python once the gesture has finished, because a re-crop per
         wheel notch would be a round trip each time.
         --------------------------------------------------------------------------------------------------- */

      function overviewPoint(event) {
        const rect = overview.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        const ox = (event.clientX - rect.left) * (overview.width / rect.width);
        const oy = (event.clientY - rect.top) * (overview.height / rect.height);
        // Note the two conventions, which are deliberately different: the center is a fraction of the frame *width*
        // across and a fraction of its *height* down (what `zoom_box` on the Python side expects). A landmark's `v`,
        // by contrast, is normalized by width. Mixing them up shifts the view vertically by the aspect ratio, which
        // looks plausible until you compare it with the frame.
        return {
          u: clamp01(ox / overview.width),
          v: clamp01(oy / overview.height),
          px: ox,
          py: oy,
        };
      }

      function applyGesture() {
        // Aiming means looking at one frame, so a gesture freezes the picture. The frame is committed with the
        // gesture's own message, so it never needs a separate round trip.
        pausePlayback();
        navigating = true;
        updateZoomReadout();
        updateHint();
        redraw();
      }

      function commitGesture(delay) {
        if (wheelTimer) clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => sendValue('navigate'), delay || 0);
      }

      overview.addEventListener(
        'wheel',
        (event) => {
          event.preventDefault();
          const point = overviewPoint(event);
          if (!point) return;
          // Zooming keeps the point under the pointer: whatever you scroll over is what you end up looking at.
          center.x = point.u;
          center.y = point.v;
          const factor = event.deltaY < 0 ? WHEEL_STEP : 1 / WHEEL_STEP;
          zoom = clamp(zoom * factor, ZOOM_MIN, ZOOM_MAX);
          applyGesture();
          commitGesture(280);
        },
        {passive: false}
      );

      overview.addEventListener('pointerdown', (event) => {
        const point = overviewPoint(event);
        if (!point) return;
        panning = true;
        movedPx = 0;
        panStart = {u: point.u, v: point.v, px: point.px, py: point.py, center: {x: center.x, y: center.y}};
        overview.setPointerCapture(event.pointerId);
      });

      overview.addEventListener('pointermove', (event) => {
        if (!panning) return;
        const point = overviewPoint(event);
        if (!point) return;
        movedPx = Math.max(movedPx, Math.hypot(point.px - panStart.px, point.py - panStart.py));
        // Panning drags the frame with the pointer, so the center moves the other way.
        center.x = clamp01(panStart.center.x + (panStart.u - point.u));
        center.y = clamp01(panStart.center.y + (panStart.v - point.v));
        applyGesture();
      });

      function endPan(event) {
        if (!panning) return;
        panning = false;
        if (movedPx <= CLICK_SLOP_PX) {
          // A click, not a drag: aim the view straight at the point that was clicked.
          const point = overviewPoint(event);
          if (point) {
            center.x = point.u;
            center.y = point.v;
          }
          applyGesture();
        }
        commitGesture(0);
      }
      overview.addEventListener('pointerup', endPan);
      overview.addEventListener('pointercancel', endPan);

      document.getElementById('zoom-in').addEventListener('click', () => {
        zoom = clamp(zoom * 2, ZOOM_MIN, ZOOM_MAX);
        applyGesture();
        commitGesture(0);
      });
      document.getElementById('zoom-out').addEventListener('click', () => {
        zoom = clamp(zoom / 2, ZOOM_MIN, ZOOM_MAX);
        applyGesture();
        commitGesture(0);
      });

      /* ---------------------------------------------------------------------------------------------------
         The timeline. The whole-frame viewport plays the proxy, so the drag is handled here and Python is told
         only when it ends - a round trip per pixel would make the preview unusable.
         --------------------------------------------------------------------------------------------------- */

      function clampFrame(value) {
        return Math.min(Math.max(Math.round(value), 0), Math.max(0, frameCount - 1));
      }

      function frameToTime(frame) {
        // A frame index maps to seconds through the analysis rate, not the proxy's duration: the proxy is built in
        // real time from the segment's start, but can be seconds short (an older window, a truncated tail).
        // Stretching the frames over the shorter duration put the bar seconds ahead of the picture on screen.
        if (analysisFps > 0) return clampFrame(frame) / analysisFps;
        if (frameCount <= 1 || duration <= 0) return 0;
        return (clampFrame(frame) / (frameCount - 1)) * duration;
      }

      function timeToFrame(time) {
        if (analysisFps > 0) return clampFrame(time * analysisFps);
        if (duration <= 0) return 0;
        return clampFrame((time / duration) * (frameCount - 1));
      }

      function updateTimelineReadout() {
        if (!videoMode) {
          timelineReadout.textContent = '';
          cropNote.textContent = '';
          return;
        }
        const frame = clampFrame(Number(scrub.value));
        const time = frameToTime(frame);
        const minutes = Math.floor(time / 60);
        const seconds = time - minutes * 60;
        timelineReadout.textContent =
          `frame ${frame} / ${Math.max(0, frameCount - 1)} · ${minutes}:${seconds.toFixed(1).padStart(4, '0')}`;
        updateCropNote(frame);
      }

      /* Scrubbing moves the picture without telling Python, so the magnified crop can lag behind it. Say so, rather
         than letting the two views quietly disagree about which frame is being shown. */
      function updateCropNote(frame) {
        if (!videoMode || !videoReady) {
          cropNote.textContent = '';
          return;
        }
        cropNote.textContent =
          frame === cropFrame
            ? ''
            : `Showing frame ${frame} - the markers belong to frame ${cropFrame}; click the whole frame to load it.`;
      }

      function pausePlayback() {
        if (!overviewVideo.paused) overviewVideo.pause();
      }

      /* A drag fires `input` many times a second; queue at most one seek per animation frame so the browser chases
         the latest position instead of a backlog of stale ones. */
      function requestSeek() {
        if (seekPending) return;
        seekPending = true;
        requestAnimationFrame(() => {
          seekPending = false;
          if (videoMode && videoReady) overviewVideo.currentTime = frameToTime(Number(scrub.value));
        });
      }

      // Land on the frame the crop was rendered from. This runs once per iframe: a remount (an Apply bumps the widget
      // key) starts at frame 0, and the viewport would otherwise jump back there after the landmarks are committed.
      function applyPendingFrame() {
        if (pendingFrame === null || !videoReady) return;
        const target = clampFrame(pendingFrame);
        pendingFrame = null;
        scrub.value = String(target);
        overviewVideo.currentTime = frameToTime(target);
        updateTimelineReadout();
        drawOverview();
      }

      scrub.addEventListener('input', () => {
        pausePlayback();
        requestSeek();
        updateTimelineReadout();
        // The bar moving off the crop's frame drops the exact still and shows the scrub video (see pictureIsExact).
        drawOverview();
      });

      // The seek that `input` queued has landed: the picture changed, so the overlay must be the one that belongs
      // to it. Drawing only on `input` would pair the new bar position with the previous picture until the next
      // event, which is exactly the lag the overlay keys off the video clock to avoid.
      overviewVideo.addEventListener('seeked', () => {
        updateTimelineReadout();
        drawOverview();
      });

      playBtn.addEventListener('click', () => {
        if (overviewVideo.paused) {
          overviewVideo.play();
        } else {
          pausePlayback();
        }
        updatePlayLabel();
      });

      function updatePlayLabel() {
        playBtn.textContent = overviewVideo.paused ? 'Play' : 'Pause';
      }

      // While playing the video drives the bar and the readout. Pausing does not commit on its own: a navigation
      // gesture pauses the video too, and committing on `pause` would fire a rerun in the middle of every drag.
      overviewVideo.addEventListener('timeupdate', () => {
        // With requestVideoFrameCallback driving, the presented-frame path owns the redraw; `timeupdate` would
        // only fight it with coarser values.
        if (overviewVideo.paused || !videoMode || presentedMediaTime !== null) return;
        scrub.value = String(timeToFrame(overviewVideo.currentTime));
        updateTimelineReadout();
        drawOverview();
      });
      function updatePlayAndPicture() {
        updatePlayLabel();
        presentedMediaTime = null; // stale until the first frame of this playing stretch is presented
        drawOverview();
        if (!overviewVideo.paused) startPlaybackTick();
      }
      overviewVideo.addEventListener('play', updatePlayAndPicture);
      overviewVideo.addEventListener('pause', updatePlayAndPicture);

      overviewVideo.addEventListener('loadedmetadata', () => {
        duration = Number.isFinite(overviewVideo.duration) ? overviewVideo.duration : 0;
        videoReady = true;
        setCanvasSize(overview, overviewVideo.videoWidth, overviewVideo.videoHeight);
        overviewVideo.currentTime = frameToTime(Number(scrub.value));
        applyPendingFrame();
        drawOverview();
        updateTimelineReadout();
        // A video element has no size before it loads, so the height sent on the first render clipped the picture.
        Streamlit.setFrameHeight();
      });

      function onRender(event) {
        args = event.detail.args || {};
        if (args.frame_data) {
          bgImage = args.frame_data;
        }
        // The proxy is optional: while it is still being built the viewport falls back to the still frame Python
        // sends instead, and the scrub row is hidden.
        videoMode = typeof args.proxy_url === 'string' && args.proxy_url.length > 0;
        layout.classList.toggle('video-mode', videoMode);
        layout.classList.toggle('image-mode', !videoMode);
        if (typeof args.frame_count === 'number' && args.frame_count >= 1) {
          frameCount = Math.round(args.frame_count);
          scrub.max = String(Math.max(0, frameCount - 1));
        }
        if (typeof args.analysis_fps === 'number' && args.analysis_fps > 0) {
          analysisFps = args.analysis_fps;
        }
        // The landmark list comes from Python (it depends on the pitch size). It only needs rewriting when the
        // list actually changes, or a rerun would close the popover the user is about to pick from.
        // The pitch overlay: per-picture homographies plus the markings. Python recomputes both whenever the
        // calibration changes, so a refit redraws the overlay on the next render without any user action.
        overlaySamples = decodeOverlay(args.overlay);
        overlayMode = args.overlay && args.overlay.mode === 'latest' ? 'latest' : 'interpolate';
        overlayPolylines = Array.isArray(args.overlay_polylines)
          ? args.overlay_polylines.map((line) => line.map(([x, y]) => [Number(x), Number(y)]))
          : [];
        if (Array.isArray(args.marker_kinds)) {
          const joined = args.marker_kinds.join('|');
          if (joined !== markerOptions) {
            markerOptions = joined;
            if (popoverOpen) closePopover();
          }
        }
        if (videoMode) {
          if (overviewVideo.getAttribute('src') !== args.proxy_url) {
            overviewVideo.setAttribute('src', args.proxy_url);
            overviewVideo.load();
          }
        }
        if (args.overview_data && args.overview_data !== overviewDataSrc) {
          // The exact crop frame rides along in video mode too: the proxy only holds one picture per second, so
          // this still is what gets compared with the crop whenever the viewport is at rest (see pictureIsExact).
          overviewDataSrc = args.overview_data;
          const loaded = new Image();
          loaded.onload = () => {
            overviewImage = loaded;
            if (!videoMode) setCanvasSize(overview, loaded.naturalWidth, loaded.naturalHeight);
            drawOverview();
          };
          loaded.src = args.overview_data;
        }
        // The frame the crop was rendered from, remembered so the note can tell when the viewport has been scrubbed
        // somewhere the crop has not followed. A scrub the *user* made is never yanked back by the next rerun - but
        // when *Python* moved the crop to another frame (a jump from the landmark list in the app), the viewport
        // follows it, because landing on that frame is the whole point of the jump. An aiming gesture sets this too,
        // and is a no-op: the bar is already on the frame the gesture carried.
        const renderedFrom = typeof args.initial_frame === 'number' ? Math.round(args.initial_frame) : 0;
        const movedByPython = mounted && videoMode && renderedFrom !== cropFrame;
        cropFrame = renderedFrom;
        if (!mounted) {
          mounted = true;
          pendingFrame = cropFrame;
          applyPendingFrame();
        } else if (movedByPython) {
          pendingFrame = renderedFrom;
          applyPendingFrame();
        }
        if (Array.isArray(args.initial_polygon)) {
          savedPolygon = args.initial_polygon.map(([x, y]) => [Number(x), Number(y)]);
        }
        if (Array.isArray(args.initial_features)) {
          // A marker the user has dragged (dirty) outranks Python's copy of it. Python's positions only change
          // when a click is committed or a drag is sent, so anything that moved since is a measurement in progress
          // - and aiming the view or zooming causes reruns that must not undo it. Matched by id: stored clicks
          // carry their pid, placed markers the landmark name they were projected from.
          const moved = new Map();
          savedFeatures.forEach((feature) => {
            if (feature && feature.type === 'point' && feature.id && feature.dirty) moved.set(feature.id, feature);
          });
          savedFeatures = args.initial_features.map((feature) => {
            const local = feature && feature.type === 'point' && feature.id ? moved.get(feature.id) : null;
            return local ? {...feature, point: local.point.slice(), dirty: true} : feature;
          });
        }
        if (typeof args.zoom === 'number') {
          zoom = clamp(args.zoom, ZOOM_MIN, ZOOM_MAX);
        }
        if (typeof args.center_x === 'number') {
          center.x = args.center_x;
        }
        if (typeof args.center_y === 'number') {
          center.y = args.center_y;
        }
        // Where the crop actually ended up, which differs from the request when it is held at a frame edge.
        lastActual = {
          x: typeof args.actual_x === 'number' ? args.actual_x : center.x,
          y: typeof args.actual_y === 'number' ? args.actual_y : center.y,
        };
        setCanvasSize(canvas, args.width || 1280, args.height || 720);
        currentPoints = [];
        // A fresh crop has arrived, so the gesture that caused it is finished - and a popover left open belongs to
        // the crop that was replaced, not this one.
        closePopover();
        navigating = false;
        updateZoomReadout();
        updateHint();
        updateTimelineReadout();
        redraw();
        Streamlit.setFrameHeight();
      }

      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
      window.addEventListener('resize', () => Streamlit.setFrameHeight());
      updateZoomReadout();
      updateHint();
      Streamlit.setFrameHeight();
    </script>
  </body>
</html>
